<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Marylou Dumas | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --beige:    #faf5ec;
  --navy:     #1a2744;
  --blue:     #4a9eff;
  --silver:   #b8c4d4;
  --sage:     #7fb99a;
  --lavender: #b59cd8;
  --pink:     #f5a0c8;
  --yellow:   #f5c842;
  --orange:   #f5a845;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: var(--beige); }

.acceuil {
  height: 100vh;
  min-height: 600px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: var(--beige);
}

.acceuil::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, #c8bfaf 1.2px, transparent 1.2px);
  background-size: 26px 26px;
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}

.hero-center {
  position: relative;
  z-index: 10;
  max-width: 560px;
  padding: 24px;
}

#animated-title {
  font-size: clamp(1.6rem, 3.8vw, 2.8rem);
  font-weight: 800;
  color: var(--navy);
  line-height: 1.25;
  margin-bottom: 14px;
}

.animated-subtitle {
  font-size: clamp(0.9rem, 1.6vw, 1.15rem);
  color: var(--navy);
  opacity: 0.72;
  font-weight: 400;
}

.hero-icon {
  position: absolute;
  z-index: 5;
  opacity: 0; /* Géré par JS */
}

/* Animation de flottement pour les icônes une fois apparues */
@keyframes wave {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-5px) rotate(1deg); }
}

.floating {
  animation: wave 3s ease-in-out infinite;
}

#mini-me img {
  width: 160px;
  height: auto;
}

.scroll-arrow {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
  color: var(--navy);
  text-decoration: none;
  opacity: 0;
  z-index: 10;
  transition: opacity 0.5s ease;
}
.scroll-arrow.visible {
  opacity: 0.55;
  animation: bounce-arrow 2.2s ease-in-out infinite;
}
@keyframes bounce-arrow {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%       { transform: translateX(-50%) translateY(9px); }
}
</style>
</head>

<script>
(function () {
  const acceuil  = document.querySelector('.acceuil');
  const icons    = document.querySelectorAll('.hero-icon');
  const arrow    = document.getElementById('scroll-arrow');

  if (!acceuil || !icons.length) return;

  const cRect = acceuil.getBoundingClientRect();
  const cx    = cRect.width  / 2;
  const cy    = cRect.height / 2;

  // Placement initial invisible au centre
  icons.forEach(el => {
    const r    = el.getBoundingClientRect();
    const elCx = r.left - cRect.left + r.width  / 2;
    const elCy = r.top  - cRect.top  + r.height / 2;
    const dx   = cx - elCx;
    const dy   = cy - elCy;

    el.style.transform  = `translate(${dx}px, ${dy}px) scale(0)`;
    el.style.opacity    = '0';
  });

  // Animation après chargement
  window.addEventListener('load', () => {
    // Liste exhaustive de tous tes éléments par ID
    const ORDER = [
      'star-1','star-2','star-3','star-4','star-5','star-6',
      'star-7','star-8','star-9','star-10','star-11','star-12',
      'icon-laptop','icon-journal','icon-books','mini-me'
    ];

    ORDER.forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;

      setTimeout(() => {
        el.style.transition = `transform 700ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 400ms ease`;
        el.style.transform  = 'translate(0, 0) scale(1)';
        el.style.opacity    = '1';
        
        // Ajout du flottement après l'apparition
        setTimeout(() => el.classList.add('floating'), 700);
      }, i * 60);
    });

    setTimeout(() => {
      if (arrow) arrow.classList.add('visible');
    }, (ORDER.length * 60) + 600);
  });
})();
</script>
